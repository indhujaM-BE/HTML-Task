<!DOCTYPE html>
<html>
    <head>
        <title>FORM VALIDATION</title>
        <meta name="viewport" content="width=device-width initial-scale=1.0">         
         <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <div class="h1 text-center text-white bg-warning">
            BOOTSTRAP FORM
        </div>
        <div class="container">
            <form class="needs-validation" novalidate>
                <div class="mb-3">
                    <label class="form-label">First Name<span class=text-danger>*</span></label>
                    <input type="text" class="form-control">

                </div>

                <div>
                    <label class="form-label">Second Name<span class="text-danger">*</span></label>
                    <input type="text" class="form-control">
                </div>

                <div>
                    <label for="width" class="form-label">Email<span class="text-danger">*</span></label>
                    <input type="text" class="form-control" required>

                    <div class="invalid-feedback">
                        plaese enter a valid email
                    </div>
                </div>

                <div>
                    <label for="password" class="form-label">password<span class="text-danger">*</span></label>
                    <input type="password" class="form-control" id="password" required minlength="3" maxlength="9">

                    <div class="invalid-feedback">
                        please enter a valid password
                    </div>
                </div>

                <div>
                    <label class="form-label">Gender</label>

                    <div class="ms-3 form-check from-check-inline">
                        <input type="radio" class="form-check-input" id="male" name="gender">
                        <label for="female" class="form-check-label">Male</label>
                    </div>

                    <div class="ms-3 form-check form-check-inline">
                        <input type="radio" class="form-check-input" id="female" name="gender">
                        <label for="female" class="form-check-label">Female</label>
                    </div>

                </div>

                <div>
                    <label for="" class="form-label">Skills</label>

                    <div class="form-check form-check-inline">
                        <input type="checkbox" class="form-check-input">
                        <label class="form-check-label">HTML</label>
                    </div>

                    <div class="form-check form-check-inline">
                        <input type="checkbox" class="form-check-input">
                        <label class="form-check-label">CSS</label>
                    </div>

                    <div class="form-check form-check-inline">
                        <input type="checkbox" class="form-check-input">
                        <label class="form-check-label">JS</label>
                    </div>

                    <div class="form-check form-check-inline">
                        <input type="checkbox" class="form-check-input">
                        <label class="form-check-label">MqSQL</label>
                    </div>
                </div>
                <div class="d-flex gap-4">
                     <button class="btn btn-success mt-3">Submit</button>
                     <button class="btn btn-danger mt-3">Reset</button>
                </div>
            </form>
        </div>
        <script>
            (() => { 

      'use strict';
      const forms = document.querySelectorAll('.needs-validation');
      forms.forEach(element => {
        element.addEventListener('submit', event => {  
          event.preventDefault();          // stop refresh

          if (element.checkValidity() == false) {
            event.stopPropagation();
          }
          element.classList.add('was-validated');
          
          
        });
      });
    })();

  </script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
       <script src="https://maps.googleapis.com/maps/api/js"></script>
    </body>
</html>
