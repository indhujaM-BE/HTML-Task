<!DOCTYPE html>
<html>
    <head>
        <title>DropDown</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <div class="d-flex gap-2 ms-3 mt-3">
            <button class="btn btn-warning dropdown-toggle"
            data-bs-toggle="dropdown"
            >Select Your City</button>

            <div class="dropdown-menu">
                <nav class="navbar">
                    <ul class="navbar-nav ms-3">
                        <li class="nav-item">Ramanadhapuram</li>
                        <li class="nav-item">Madurai</li>
                        <li class="nav-item">Chennai</li>
                        <li class="nav-item">Erode</li>
                        <li class="nav-item">Selam</li>
                        <li class="nav-item">Thoothukudi</li>
                        <li class="nav-item">Ooty</li>
                        <li class=""nav-item>Thanjavur</li>
                    </ul>
                </nav>
            </div>
        
                    <div class="dropdown">
                <button class="btn btn-info dropdown-toggle"
                        data-bs-toggle="dropdown">
                    Select Area
                </button>

                <div class="dropdown-menu">
                    <nav class="navbar">
                        <ul class="navbar-nav ms-3">
                            <li class="nav-item">Town</li>
                            <li class="nav-item">Bus Stand</li>
                            <li class="nav-item">Railway Station</li>
                            <li class="nav-item">Market</li>
                            <li class="nav-item">Beach</li>
                            <li class="nav-item">Main Road</li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>

        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
